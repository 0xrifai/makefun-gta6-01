<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palmera Bay — an open-world crime story</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e8d8a8; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Palmera Bay: an open-world crime game. Drive, steal cars, dodge the police and finish Leo Marlow's four missions."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module">
  import { boot } from './src/main.js';
  const canvas = document.getElementById('game');
  const game = boot(canvas);
  window.__palmera = game; // for play-testing and screenshots
  window.addEventListener('error', (e) => { window.__errors = window.__errors || []; window.__errors.push(String(e.message)); });
</script>
</body>
</html>
